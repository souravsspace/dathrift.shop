services:
  pocketbase:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PB_HOST_PORT:-8090}:8080'
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/health']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pb_data:
