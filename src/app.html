	<head>
		<meta charset="utf-8" />

		<meta name="text-scale" content="scale" />
		%sveltekit.head%

	<body data-sveltekit-preload-data="hover">
		<!--
			THESIS: A daylight rail where the garment photo leads and every fact a buyer needs (price, size, chest or waist in inches, flaws) is one glance away; refuses both the dark tag-over-photo clutter it replaced and the cream serif editorial shop.
			OWN-WORLD: Warm paper ground (#faf7f1), white sheets with hairlines, logo ink #04241a for text and the one solid action, gold #d3b07f only for counts and the rail, notched ivory size tags, condensed Archivo with Martian Mono data, Lucide outline icons.
			STORY: Shoppers search or filter by size, price and their own measurements, trust the honest listing, and bag the single piece before anyone else.
			FIRST VIEWPORT: Left, "Every piece here is one of one." with gold-underlined words, a search pill and Shop all; right, the owner-featured photo with one swing tag hanging over its edge.
			FORM: User-pinned light photo-first direction, seed 23e8f4a5 (catalog challengers declined).
			FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
